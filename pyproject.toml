[project]
name = "kannada-epub-translator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "EbookLib>=0.18",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "ctranslate2>=4.8",
    "sentencepiece>=0.2",
    "IndicTransToolkit>=1.1",
    "huggingface_hub>=0.25",
    "torch>=2.0",
    "transformers>=4.40,<5",
    "numpy>=1.26",
    "soundfile>=0.12",
    "parler_tts>=0.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# gradio<5: v6 pulls huggingface-hub v1, which breaks transformers<5
# (needed by the local TTS path). Keep the GUI dep fenced off.
gui = ["gradio>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]