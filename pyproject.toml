[project]
name = "indic-book-translator"
version = "0.1.0"
description = "Translate English EPUB books into Kannada (more Indic languages planned), with QA scoring, EPUB output and optional audiobook narration."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "assets/fonts/OFL.txt"]
authors = [{ name = "Vinith" }]
requires-python = ">=3.11"
keywords = [
    "epub",
    "translation",
    "kannada",
    "indic",
    "tts",
    "audiobook",
    "nlp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Kannada",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "openai>=1.40",
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "numpy>=1.26",
    "soundfile>=0.12",
    "python-dotenv>=1.0",
    "platformdirs>=4",
    "pillow>=10",
]

[project.urls]
Homepage = "https://github.com/vineethsudhir/indic-book-translator"
Issues = "https://github.com/vineethsudhir/indic-book-translator/issues"
Changelog = "https://github.com/vineethsudhir/indic-book-translator/blob/main/CHANGELOG.md"

[project.scripts]
kannada-translator = "kannada_epub.app.server:main"

[project.optional-dependencies]
# The custom app needs FastAPI, Uvicorn and multipart upload support.
gui = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]
# Contributor tools: the linter and the websocket client the browser test uses.
dev = [
    "ruff>=0.6",
    "websockets>=12",
]
# Local (on-device) translation/TTS/QA models. Cloud-only installs do not need
# these; install them with: pip install -e .[local]
local = [
    "ctranslate2>=4.8",
    "sentencepiece>=0.2",
    "IndicTransToolkit>=1.1",
    "huggingface_hub>=0.25",
    "torch>=2.0",
    "transformers>=4.40,<5",
    "parler_tts>=0.2",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kannada_epub = ["app/static/*.html", "app/static/*.css", "app/static/*.js"]

[tool.setuptools.data-files]
"assets/fonts" = ["assets/fonts/NotoSansKannada-Regular.ttf", "assets/fonts/NotoSansKannada-Bold.ttf"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F", "B", "I"]
