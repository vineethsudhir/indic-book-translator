[project]
name = "kannada-epub-translator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "anthropic>=0.40",
    "pyyaml>=6.0",
    # pydantic<2.12: newer versions emit boolean JSON schemas that gradio 4's
    # API parser cannot read, breaking `scripts/gui.py` at launch.
    "pydantic>=2.9,<2.12",
    "httpx>=0.27",
    "EbookLib>=0.18",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "numpy>=1.26",
    "soundfile>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Pinned as a set (verified together): gradio 6 pulls huggingface-hub v1
# which breaks transformers (local TTS), while newer fastapi/starlette/
# pydantic break gradio 4's startup health-check. Install with: pip install -e .[gui]
gui = [
    "gradio>=4,<5",
    "huggingface_hub<1.0",
    "fastapi==0.115.*",
    "starlette==0.41.*",
]
# Local (on-device) translation/TTS/QA models. Cloud-only installs do not need
# these; install them with: pip install -e .[local]
local = [
    "ctranslate2>=4.8",
    "sentencepiece>=0.2",
    "IndicTransToolkit>=1.1",
    "huggingface_hub>=0.25",
    "torch>=2.0",
    "transformers>=4.40,<5",
    "parler_tts>=0.2",
]

[tool.setuptools.packages.find]
where = ["src"]