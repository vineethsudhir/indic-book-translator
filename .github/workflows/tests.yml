name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install cloud app and contributor tools
        run: python -m pip install -e ".[gui,dev]"
      - name: Lint
        run: ruff check src scripts
      - name: Run fast offline tests
        run: |
          python scripts/test_sentence_split.py
          python scripts/test_epub_io.py
          python scripts/test_epub_writer.py
          python scripts/test_tables.py
          python scripts/test_qa.py
          python scripts/test_pipeline.py
          python scripts/test_app.py
          python scripts/test_tts_engine.py
          python scripts/test_ui_browser.py
